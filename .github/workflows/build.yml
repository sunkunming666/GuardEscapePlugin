name: Build Plugin

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore
      run: dotnet restore src/GuardEscapePlugin.csproj

    - name: Build
      run: dotnet build src/GuardEscapePlugin.csproj -c Release

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GuardEscapePlugin
        path: src/bin/Release/netstandard2.0/GuardEscapePlugin.dll
